# ============================================================
# 项目003 · 邮箱聚合平台 —— CI 工作流
# 触发：push 到 main/master / 任意 PR
# 三套实现各自独立的 Job（Go 主干 / TS PoC / React 前端）：
#   - Go  ：go build / go vet / go test / go build -tags integration
#   - TS  ：demo + 单测 + tsc --noEmit（Node 22，--experimental-strip-types）
#   - Web ：tsc + vite build
# 注：真实中间件（PG/MinIO/OpenSearch/Kafka）端到端联调需 Docker 栈，
#    不在本 CI 内执行（见 tests/integration_real_e2e.ts，本地手动运行）。
# ============================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go 主干 (build/vet/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-aggregator-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Integration build (-tags integration)
        run: go build -tags integration ./...

  ts:
    name: TS PoC (demo/test/typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-aggregator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: email-aggregator/package-lock.json

      - name: Install deps
        run: npm ci

      - name: E2E demo
        run: node --experimental-strip-types src/demo.ts

      - name: Unit tests
        run: node --test --experimental-strip-types tests/*.test.ts

      - name: Typecheck (strict)
        run: npm run typecheck

  web:
    name: React 前端 (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-aggregator-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: email-aggregator-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build
