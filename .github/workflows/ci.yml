# ============================================================
# 项目003 · 邮箱聚合平台 —— CI 工作流
# 触发：push 到 main/master / 任意 PR
# 三套实现各自独立的 Job（Go 主干 / TS PoC / React 前端），
# 外加 version-guard（版本一致性）与 integration（真实中间件）。
#   - Go   ：go build / go vet / go test / go build -tags integration
#   - TS   ：demo + 单测 + tsc --noEmit（Node 22，--experimental-strip-types）
#   - Web  ：tsc + vite build
#   - 集成 ：service 容器拉真实 PG / MinIO / OpenSearch / Kafka，
#            并先重放迁移 + 预建桶（scripts/bootstrap-integration.mjs）再跑端到端
# ============================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  ⓿ 版本门禁 —— 全项目共享一个权威版本源（version.json）。
  #     任何落点（Go/前端/云函数/容器/桌面/移动/鸿蒙）与它不一致即失败，
  #     避免"项目版本号"与"部署版本号"漂移。
  # ─────────────────────────────────────────────────────────────────────────
  version-guard:
    name: 版本一致性门禁 (MALLV 规范)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 落点必须与 version.json 完全一致
        run: |
          set -euo pipefail
          node scripts/version.mjs sync
          if ! git diff --quiet; then
            echo "::error::存在版本落点与 version.json 不一致。请在本地执行 node scripts/version.mjs sync 并提交。"
            git --no-pager diff --stat
            exit 1
          fi
          node scripts/version.mjs verify

      - name: 工具脚本语法自检
        run: |
          set -euo pipefail
          node --check scripts/version.mjs
          node --check scripts/sync-web-assets.mjs
          node --check scripts/make-icon.mjs
          node --check email-aggregator/scripts/bootstrap-integration.mjs
          node --check platforms/desktop/scripts/prepare.mjs
          node --check platforms/desktop/scripts/build.mjs
          node --check platforms/desktop/scripts/verify-artifacts.mjs
          node --check platforms/mobile/scripts/prepare.mjs
          node --check platforms/mobile/scripts/build.mjs
          node --check platforms/mobile/scripts/verify-artifacts.mjs
          node --check platforms/harmony/scripts/prepare.mjs
          node --check platforms/harmony/scripts/build.mjs

      - name: 汇总版本信息
        run: |
          set -euo pipefail
          node scripts/version.mjs show
          {
            echo "### 版本号：$(node scripts/version.mjs show --json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).canonical')"
            echo ""
            echo '```'
            node scripts/version.mjs show
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  go:

    name: Go 主干 (build/vet/test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-aggregator-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Integration build (-tags integration)
        run: go build -tags integration ./...

  ts:
    name: TS PoC (demo/test/typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-aggregator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: email-aggregator/package-lock.json

      - name: Install deps
        run: npm ci

      - name: E2E demo
        run: node --experimental-strip-types src/demo.ts

      - name: Unit tests
        run: node --test --experimental-strip-types tests/*.test.ts

      - name: Typecheck (strict)
        run: npm run typecheck

  web:
    name: React 前端 (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-aggregator-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: email-aggregator-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

  integration:
    name: 真实中间件集成（PG/MinIO/OpenSearch/Kafka）
    runs-on: ubuntu-latest
    # 集成栈连接参数集中在 **job 级**：预置步骤与测试步骤必须看到同一组值。
    # 此前参数只写在 TS 测试步骤上，导致"环境预置"这一步根本不存在，
    # 于是测试必然双 FAIL（relation mail_metadata / bucket 不存在）。
    env:
      PG_DSN: postgres://agg:agg-secret@127.0.0.1:15432/mailagg
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_BUCKET: agg-mail
      MINIO_ACCESS_KEY: agg
      MINIO_SECRET_KEY: agg-secret
      MINIO_SECURE: "false"
      OPENSEARCH_ADDR: https://127.0.0.1:9200
      OPENSEARCH_USER: admin
      OPENSEARCH_PASS: Admin123!Strong
      KAFKA_BROKERS: 127.0.0.1:9092
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agg
          POSTGRES_PASSWORD: agg-secret
          POSTGRES_DB: mailagg
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U agg -d mailagg"
          --health-interval 5s --health-timeout 5s --health-retries 15
      # ⚠️ MinIO 已从 Docker Hub 下架（`minio/minio` → pull access denied /
      #    repository does not exist）。必须在 Quay 拉取，且**固定 RELEASE 版本**
      #    而非 :latest —— 它决定 S3 兼容行为，漂移会让"同一提交今天过明天挂"。
      #    另：该镜像基于 ubi-micro，**没有 bash / curl / 甚至 sh**，
      #    故不能写 `--health-cmd "bash -c ..."`（旧写法从未真正生效过）。
      #    改为在 steps 里显式轮询 /minio/health/live，见"等待 MinIO 就绪"。
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        command: server /data
        env:
          MINIO_ROOT_USER: agg
          MINIO_ROOT_PASSWORD: agg-secret
        ports: ["9000:9000"]
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          bootstrap.memory_lock: "false"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Admin123!Strong"
          OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx768m"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/localhost/9200' || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 30
      kafka:
        image: apache/kafka:latest
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
          KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports: ["9092:9092"]
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/localhost/9092' || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: email-aggregator/package-lock.json

      - name: TS deps
        working-directory: email-aggregator
        run: npm ci

      # MinIO 镜像内无 curl/sh，无法用 service health-cmd 探活，
      # 故在 runner 侧轮询其健康端点，把"镜像没起来"变成显式失败，
      # 而不是让后面的集成测试抛一堆连接拒绝（难定位）。
      - name: 等待 MinIO 就绪
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO 已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO 未在 80 秒内就绪。请确认 quay.io/minio/minio 镜像可拉取，且 9000 端口已映射。"
          exit 1

      # 容器起来 ≠ schema 就绪 —— 先重放 PG 迁移 + 预建 MinIO 桶。
      # 与 deploy/bootstrap.sh 的第 2、3 步等价，但**不需要 Docker**（直接用 pg / minio 客户端），
      # 故本地无 Docker 也能跑，且与生产 bootstrap 走同一批迁移文件。
      - name: 预置集成环境（PG 迁移 + MinIO 建桶）
        working-directory: email-aggregator
        run: node scripts/bootstrap-integration.mjs

      - name: Go 集成测试（真实 Kafka e2e：roundtrip/DLQ/幂等消费）
        working-directory: email-aggregator-go
        run: go test -tags integration ./src/integration/...

      - name: TS 集成层真实联调（PG/MinIO/OpenSearch/Kafka）
        working-directory: email-aggregator
        run: npx --yes tsx tests/integration_real_e2e.ts