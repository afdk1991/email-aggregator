# =============================================================================
# Grafana 数据源 provisioning（Phase 2 / 蓝图 §10 Grafana）
# -----------------------------------------------------------------------------
# 启动时自动加载 Prometheus 数据源，无需手动添加；
# 与 prometheus.yml 中的 alertmanager 服务名对齐。
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
