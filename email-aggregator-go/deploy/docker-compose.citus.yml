# ============================================================================
# docker-compose.citus.yml — Phase 3 真实 Citus 集群验证（1 Coordinator + 2 Workers）
#
# 目的：在 PoC 环境验证 ADR-009 分布键 = tenant_id 的真实物理分片行为。
#   - Coordinator（cn）：元数据 + 查询路由，不存分片数据
#   - Worker 1/2（w1/w2）：实际持有 shards，按 tenant_id hash 分布
#
# 与 docker-compose.yml 的关系：
#   - 本文件是 docker-compose.yml 的 *override*，仅启动 Citus 集群，不包含
#     Kafka/MinIO/OpenSearch/Prometheus 等周边栈。
#   - 验证流程：先 `docker compose -f docker-compose.citus.yml up -d`
#     → 等 cn 健康 → 跑 migrations/006_citus_workers.sql 注册 workers
#     → 跑 migrations/002 把表声明为 distributed → 跑 scripts/verify-citus-sharding.ps1
#     → 验证跨 worker 分片分布。
#
# 启动：
#   cd deploy
#   docker compose -f docker-compose.citus.yml up -d
#   # 等 cn healthy 后：
#   docker compose -f docker-compose.citus.yml exec cn psql -U agg -d mailagg -f /migrations/006_citus_workers.sql
#   docker compose -f docker-compose.citus.yml exec cn psql -U agg -d mailagg -f /migrations/001_init.sql
#   docker compose -f docker-compose.citus.yml exec cn psql -U agg -d mailagg -f /migrations/002_citus_sharding.sql
#
# 与 docker-compose.yml 的兼容性：
#   - 端口 ${PG_PORT} 由 cn 暴露，集成服务 PG_DSN 指向 cn 即可，
#     业务侧无感知（Citus 对客户端透明，发 SQL 到 cn 即可路由到 worker）。
#   - 真实部署若已运行 docker-compose.yml 的单节点 postgres，可先停止它：
#       docker compose stop postgres
#     再启动本集群，业务容器通过 service name `cn` 连接（需相应改 PG_DSN host=cn）。
# ============================================================================

services:
  # Coordinator 节点：接收业务 SQL、维护分布式元数据、路由查询到 worker。
  # 不持有分片数据；shard 在 worker 上以普通 PG 表形态存在。
  cn:
    image: citusdata/citus:12.1.3
    container_name: citus-cn
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-agg}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agg-secret}
      POSTGRES_DB: ${PG_DATABASE:-mailagg}
    ports: ["${PG_PORT:-5432}:5432"]
    volumes:
      # 迁移脚本以只读方式挂载到 cn（006 在 cn 上执行，注册 w1/w2）
      - ./migrations:/migrations:ro
      - cn_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-agg}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [citus_net]

  # Worker 1：持有按 tenant_id hash 落到本节点的 shards。
  # 业务从不直连 worker；所有请求经 cn 路由。
  w1:
    image: citusdata/citus:12.1.3
    container_name: citus-w1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-agg}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agg-secret}
      POSTGRES_DB: ${PG_DATABASE:-mailagg}
      # 标记 worker 身份：cn 在 citus_add_node 时通过 host:w1 port:5432 注册
    volumes:
      - w1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-agg}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [citus_net]

  # Worker 2：第二组分片节点。1C+2W 拓扑足以验证：
  #   - create_distributed_table 后 shard_count 默认 32，分布在 w1/w2 两节点；
  #   - 同 tenant_id 的所有行落在同一 shard → 同一 worker，验证 colocation；
  #   - 跨租户查询经 cn 路由 fan-out 到 w1+w2，验证分布式聚合。
  w2:
    image: citusdata/citus:12.1.3
    container_name: citus-w2
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-agg}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agg-secret}
      POSTGRES_DB: ${PG_DATABASE:-mailagg}
    volumes:
      - w2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-agg}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [citus_net]

volumes:
  cn_data:
  w1_data:
  w2_data:

networks:
  # Citus 集群内部网络：cn/w1/w2 通过 service name 互连（cn 用 w1/w2 注册 worker）
  citus_net:
    driver: bridge
