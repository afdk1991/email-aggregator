# email-aggregator-go 真实集成栈（Phase 0+ 联调用）
# 凭证与端口统一来自同目录 .env（参见仓库根 .env.example）。
# 启动：cd deploy && docker compose up -d

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports: ["${PG_PORT}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 迁移脚本以只读方式挂入容器，由 deploy/bootstrap.sh 经
      # `docker compose exec postgres psql -f /migrations/001_init.sql` 显式执行。
      # 注意：不挂到 /docker-entrypoint-initdb.d —— 该目录会被 PG 入口脚本
      # 当作初始化脚本执行，而本目录下 run.sh(.sh) 与 002(citus) 在纯 PG 环境
      # 会误执行/报错；显式 bootstrap 更可控且可幂等重放。
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 注：PgBouncer 连接池在本机镜像源（docker.m.daocloud.io 镜像）下对 pgbouncer 各镜像
  # 均返回 403 Forbidden，无法拉取，故从「一键就绪」栈中移除。集成服务通过 PG_DSN
  # 直连 postgres，功能不受影响；生产 HA 若需 PgBouncer，请改用可拉的镜像或私有仓库。
  # pgbouncer:
  #   image: edoburu/pgbouncer:latest
  #   ...

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["${MINIO_PORT}:9000", "${MINIO_CONSOLE_PORT}:9001"]
    volumes: ["miniodata:/data"]

  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    # 接入 mixmlaal SaaS 业务链：加入其网络，供业务容器检索审计/日志
    networks:
      - default
      - mixmlaal
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      bootstrap.memory_lock: "true"
      "OPENSEARCH_JAVA_OPTS": "-Xms512m -Xmx512m"
    ports: ["${OPENSEARCH_PORT}:9200"]
    volumes: ["osdata:/usr/share/opensearch/data"]
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # Kafka  broker：本地镜像源（docker.m.daocloud.io）对 redpandadata/redpanda 各镜像
  # 均返回 403，故一键栈改用 apache/kafka（KRaft 单节点）。kafka-go 客户端协议兼容，
  # 集成服务无需改动。生产可改回 redpanda（仅需把镜像与 bootstrap 的 rpk 命令换回）。
  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports: ["${KAFKA_PORT}:9092"]
    # 接入 mixmlaal SaaS 业务链：加入其网络，advertised 用容器名供业务容器解析
    networks:
      - default
      - mixmlaal
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # 监听 0.0.0.0 以便「宿主机（集成服务运行处）」经 127.0.0.1:9092 与「容器内」经 kafka:9092 均可连；
      # 广播地址用 localhost:9092，确保宿主机上的 kafka-go 客户端在 bootstrap 后能被正确重定向（否则会拿到 kafka:9092 而解析失败）。
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://deploy-kafka-1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
    volumes: ["rpdata:/tmp/kraft-combined-logs"]

  # 工具容器：仅 bootstrap.sh 经 `docker compose run --rm --entrypoint sh mc` 使用时才启动，
  # 普通 `docker compose up -d` 因 profiles:[tools] 不会拉起它。用于创建 MinIO 桶。
  mc:
    image: minio/mc:latest
    depends_on: [minio]
    profiles: ["tools"]
    networks: [default]

volumes:
  pgdata:
  miniodata:
  rpdata:
  osdata:

networks:
  # mixmlaal SaaS 业务网络（external），让 Kafka 可被业务容器经 deploy-kafka-1 访问
  mixmlaal:
    external: true
    name: mixmlaal_mixmlaal-network
